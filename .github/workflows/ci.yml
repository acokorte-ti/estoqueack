name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  segredos:
    # Bloqueia senhas/tokens nos arquivos do commit (incidente 2026-10-29). Sem segredo encontrado = verde.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks (arquivos atuais)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 dir /repo --config /repo/.gitleaks.toml --redact --no-banner

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: estoqueack
          POSTGRES_USER: estoqueack
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U estoqueack" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Migrações no PostgreSQL (sobe e desce)
        env:
          DATABASE_URL: postgresql+psycopg://estoqueack:ci@localhost:5432/estoqueack
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Testes
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build

  docker:
    # Build nativo em ARM64 (mesma arquitetura do system-lab), sem emulação QEMU
    runs-on: ubuntu-24.04-arm
    needs: [segredos, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build ARM64 (system-lab / OCI Ampere)
        run: |
          docker build -t estoqueack-api ./backend
          docker build -f deploy/Dockerfile.web -t estoqueack-web .
