[project]
name = "estoqueack-backend"
version = "0.1.0"
description = "EstoqueACK — controle de matéria-prima AçoKorte (API)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S"]
# B008: Depends() em parâmetros é o padrão do FastAPI; S105/S106: falsos positivos em nomes de config
ignore = ["S101", "E741", "B008", "S105", "S106", "UP017"]  # UP017: manter timezone.utc (compatível com Python 3.10)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"alembic/*" = ["E501", "S608"]
# Só constantes (esquema/filial) entram no f-string; valores do usuário vão sempre por bind variable
"app/integrations/mega/consultas.py" = ["S608"]
