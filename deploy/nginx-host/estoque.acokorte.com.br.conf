# Site do EstoqueACK no nginx do servidor (system-lab), no mesmo padrão de inventario/query.
# Instalação (como root): ver deploy/README-system-lab.md
server {
    listen 80;
    server_name estoque.acokorte.com.br;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name estoque.acokorte.com.br;

    ssl_certificate     /etc/letsencrypt/live/estoque.acokorte.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estoque.acokorte.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
