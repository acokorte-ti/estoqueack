# Site do EstoqueACK no nginx do servidor (system-lab), no mesmo padrão de inventario/query.
# Instalação (como root): ver deploy/README-system-lab.md
server {
    listen 80;
    server_name estoque.acokorte.com.br;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;   # sintaxe do nginx 1.18 (Ubuntu 22.04)
    server_name estoque.acokorte.com.br;

    ssl_certificate     /etc/letsencrypt/live/estoque.acokorte.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estoque.acokorte.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Acesso (2026-11-23): IP da empresa (ips-estoqueack.conf: Itu Agil e Vivo + Barra Mansa) OU certificado de
    # cliente da AçoKorte, para quem acessa de fora ou de IP que muda (RJ). Ligado e emitido por acesso_certificado.sh
    ssl_client_certificate /etc/nginx/estoqueack-ca/ca.crt;
    ssl_verify_client optional;
    ssl_verify_depth 1;
    satisfy any;
    include /etc/nginx/snippets/ips-estoqueack.conf;
    auth_request /_acesso_certificado;
    location = /_acesso_certificado {
        internal;
        if ($ssl_client_verify = SUCCESS) { return 204; }
        return 403;
    }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
