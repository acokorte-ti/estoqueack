# Desenvolvimento local: só o PostgreSQL em container.
# API: cd backend && uvicorn app.main:app --reload
# Web: cd frontend && npm run dev
name: estoqueack-dev
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: estoqueack
      POSTGRES_USER: estoqueack
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
volumes:
  pgdata_dev:
