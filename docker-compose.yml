# EstoqueACK — homologação/produção no system-lab (Ubuntu ARM64), atrás do nginx do servidor.
# Uso: docker compose up -d --build   (o site fica em 127.0.0.1:${WEB_PORTA:-8090}; o nginx do host faz o HTTPS)
name: estoqueack

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [interna]
    # Sem "ports": o banco NÃO é exposto fora da VM.

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    networks: [interna]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/saude').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORTA:-8090}:80"
    depends_on: [api]
    networks: [interna]

volumes:
  pgdata:

networks:
  interna:
